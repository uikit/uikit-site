name: Promote develop

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: promote-develop
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Create promotion pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: promote/develop-to-main
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo 'Develop has already been promoted to main.'
            exit 0
          fi

          git switch -C "$BRANCH"
          git push --force origin "$BRANCH"

          pr_number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            pr_number=$(gh pr create \
              --head "$BRANCH" \
              --base main \
              --title 'chore: promote develop to main' \
              --body 'Promotes the latest changes from `develop` to `main`.')
          fi
          echo "pull-request-number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Merge promotion pull request
        if: steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --merge --delete-branch
          if [ "$(gh pr view "$PR_NUMBER" --json state --jq '.state')" != MERGED ]; then
            echo '::error::Promotion has not merged; deployment will not be triggered.'
            exit 1
          fi

      # GITHUB_TOKEN merges do not trigger the deployment's push workflow.
      # Dispatch even on a retry where the promotion has already merged.
      - name: Trigger deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run uikit-site.yml --ref main
