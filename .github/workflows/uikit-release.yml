name: Update UIkit

on:
  repository_dispatch:
    types: [uikit-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: uikit-release-${{ github.event.client_payload.version }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Validate release version
        id: release
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Expected a published UIkit version in client_payload.version.'
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r '.devDependencies.uikit' package.json)" != "$RELEASE_VERSION" ]; then
            echo 'update=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.release.outputs.update == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: steps.release.outputs.update == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Wait for npm publication
        if: steps.release.outputs.update == 'true'
        timeout-minutes: 11
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            if published_version=$(npm view "uikit@$RELEASE_VERSION" version \
              --registry=https://registry.npmjs.org --prefer-online \
              --fetch-retries=0 --fetch-timeout=15000) && [ "$published_version" = "$RELEASE_VERSION" ]; then
              echo "uikit@$RELEASE_VERSION is available on npm."
              exit 0
            fi
            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then
              break
            fi
            echo "Waiting for uikit@$RELEASE_VERSION to propagate to npm..."
            sleep "$((remaining < 30 ? remaining : 30))"
          done
          echo "::error::uikit@$RELEASE_VERSION did not become available on npm within 10 minutes."
          exit 1

      - name: Update UIkit dependency
        if: steps.release.outputs.update == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: pnpm add --save-dev --save-exact --lockfile-only --ignore-scripts "uikit@$RELEASE_VERSION"

      - name: Create pull request
        id: pull-request
        if: steps.release.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: update/uikit-${{ steps.release.outputs.version }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C "$BRANCH"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(deps): update uikit to $RELEASE_VERSION"
          git push --force origin "$BRANCH"

          pr_number=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            pr_number=$(gh pr create \
              --head "$BRANCH" \
              --base develop \
              --title "chore(deps): update uikit to $RELEASE_VERSION" \
              --body "Updates UIkit to the newly published npm version \`$RELEASE_VERSION\`.\n\nRelease notes: https://github.com/uikit/uikit/releases/tag/v$RELEASE_VERSION")
          fi
          echo "pull-request-number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Merge update pull request
        if: steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch

      - name: Trigger main promotion
        if: steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote-develop.yml --ref develop
