name: Deploy UIkit Site

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      base_image_source:
        description: Registry for Node and httpd base images
        required: true
        default: docker-hub
        type: choice
        options:
          - docker-hub
          - ecr-public

env:
  ANSIBLE_REMOTE_USER: root
  ANSIBLE_PYTHON_INTERPRETER: auto_silent

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      base_image_source: ${{ inputs.base_image_source || 'docker-hub' }}

  deploy:
    needs: [build]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run playbook
        uses: dawidd6/action-ansible-playbook@v9
        with:
          playbook: ./.github/playbooks/setup.yml
          options: -e "uikit_domain='getuikit.com, www.getuikit.com'"
          inventory: |
            [uikit]
            91.98.38.146

          key: ${{ secrets.ACTIONS_SSH_PRIVATE_KEY }}
